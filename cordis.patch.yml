# dsh-llm-ai bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package: when
# the plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-llm-ai
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-llm-ai` to the bundle stack. The
# profile boot then merges THIS patch exactly like a manual cordis.patch.yml
# entry. No profile file edits needed — one command installs and mounts.
#
# The mount REPLACES the bundled pi-ai adapter rather than coexisting with it:
# the configurable-provider directory keys provider ids globally, and both
# adapters declaring the same catalog id fails DUPLICATE_DIRECTORY at load.
# If the profile still carries the old manual mount lines in its own
# cordis.patch.yml (a `llm-ai` insert and/or a `llm-pi-ai` disable), remove
# them after switching to the bundle channel to avoid a duplicate llm-ai
# entry id.
#
# Bundled-UI note: DSH Desktop / web-app builds that predate the llm-ai
# migration hardcode the `llm-pi-ai` settings namespace in their Models page.
# On such builds, apply the single-string namespace alias documented in the
# README (Deployment, step 4) to the installed copy under node_modules.
- id: llm-pi-ai
  disabled: true
- insert:
    - id: llm-ai
      name: dsh-llm-ai
